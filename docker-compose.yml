services:
  postgres:
    image: postgres:18
    container_name: atlas-postgres
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      # Local development only.
      POSTGRES_PASSWORD: atlas
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 wants the volume at the parent path and creates its own
      # major-version subdirectory; mounting .../data directly breaks startup.
      - atlas-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: atlas-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # M6 (optional): the counterparty graph. NEO4J_PLUGINS pulls the Graph Data
  # Science library on first start; Neo4j blocks its gds.* procedures until
  # they are explicitly allowlisted.
  neo4j:
    image: neo4j:5-community
    container_name: atlas-neo4j
    environment:
      # Local development only.
      NEO4J_AUTH: neo4j/atlas-demo-password
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    ports:
      - "7474:7474"   # Browser UI, for exploring the graph by hand
      - "7687:7687"   # Bolt, for the Python driver
    volumes:
      - atlas-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # KRaft mode, single broker: Kafka runs its own consensus, so there is no
  # second ZooKeeper container to stand up.
  kafka:
    image: apache/kafka:latest
    container_name: atlas-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners, because Kafka's metadata response hands clients an
      # address to reconnect to. PLAINTEXT (9092) is advertised to the host;
      # INTERNAL (29092) to other containers. With only the first, a container
      # client is told "reconnect to localhost", which is its own namespace.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  fraud-service:
    build: services/fraud-service
    container_name: atlas-fraud-service
    # Needs services/fraud-service/models/model.json to exist first; the image
    # cannot train it (see README). Startup fails fast rather than serving
    # without a model.
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Started, not healthy: Neo4j's healthcheck waits on the GDS plugin
      # download, and M6 is optional. The driver connects lazily, so an early
      # GET /rings fails that one request rather than startup.
      neo4j:
        condition: service_started
    environment:
      FRAUD_REDIS_URL: redis://redis:6379/0
      # The INTERNAL listener - see the kafka service above.
      ATLAS_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Unset would mean GET /rings reports itself disabled.
      ATLAS_NEO4J_URI: bolt://neo4j:7687
      ATLAS_NEO4J_USER: neo4j
      ATLAS_NEO4J_PASSWORD: atlas-demo-password
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-api:
    build:
      context: .
      dockerfile: services/payment-api/Dockerfile
    container_name: atlas-payment-api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      fraud-service:
        condition: service_healthy
    environment:
      ATLAS_DB_URL: jdbc:postgresql://postgres:5432/atlas
      ATLAS_DB_USER: atlas
      ATLAS_DB_PASSWORD: atlas
      ATLAS_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ATLAS_FRAUD_SERVICE_URL: http://fraud-service:8001
      # No default anywhere; compose reads it from the gitignored .env.
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    container_name: atlas-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      payment-api:
        condition: service_healthy

  ops-console:
    build:
      context: ./ops-console
      args:
        # Baked into the static bundle at build time. localhost, not
        # payment-api: the browser on the host resolves this, not compose.
        VITE_API_BASE_URL: http://localhost:8080
    container_name: atlas-ops-console
    ports:
      - "3002:80"
    depends_on:
      payment-api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: atlas-grafana
    environment:
      # Local demo only.
      GF_SECURITY_ADMIN_PASSWORD: atlas-demo
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  atlas-pgdata:
  atlas-neo4j-data:
