name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here is deploy-shaped, so an in-flight run of stale code is waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans history: a secret committed once and later deleted
          # is still a leak, and the default depth of 1 would miss it.
          fetch-depth: 0

      # No allowlist needed: the test-only JWT constant and the local-dev
      # passwords are too low-entropy to trip the default rules.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Without this the toolchain resolver downloads a JDK on every run.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The wrapper jar is a committed binary that the build executes.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build
        run: ./gradlew build --no-daemon

      # Runs on failure too, so a red build shows which tests broke.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: services/payment-api/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 14

  fraud-service:
    name: Fraud service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # uv pins Python itself, per pyproject.toml's requires-python.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"

      - name: Install dependencies
        working-directory: services/fraud-service
        run: uv sync --locked

      # Runs against a small, fast, synthetic fixture model (tests/conftest.py),
      # not the real trained artifact - the 494MB PaySim CSV it trains from is
      # not distributed with this repo (see docs/sources.md). The real
      # training run and its metrics are verified locally and recorded in
      # models/metrics.json, which IS committed.
      #
      # test_feature_latency.py skips itself (not fails) when no Redis is
      # reachable, which is the case on this runner — its real-Redis p99
      # number is measured and reported in the README, not re-verified here.
      - name: Test
        working-directory: services/fraud-service
        run: uv run pytest -v
