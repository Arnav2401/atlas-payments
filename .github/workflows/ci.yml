name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. Nothing here is
# deploy-shaped, so an in-flight run of stale code is pure waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Provides the Java 21 that build.gradle.kts pins via the toolchain.
      # Without this, the Foojay resolver downloads a JDK on every run — it
      # would still work, just slower and dependent on an external service.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Fails the run if gradle-wrapper.jar does not match a known-good release.
      # The wrapper jar is a binary committed to the repo that the build
      # executes, so it is the one file here worth verifying on every push.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build
        run: ./gradlew build --no-daemon

      # Runs even when the build failed — a red run is only useful if you can
      # see which tests failed without re-running locally.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: services/payment-api/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 14

  fraud-service:
    name: Fraud service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # uv installs and pins Python 3.12 itself (per pyproject.toml's
      # requires-python), the same way it does in local development — see
      # README. No macOS libomp workaround needed here: Ubuntu's XGBoost
      # wheel links against libgomp1, which the runner image ships already.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"

      - name: Install dependencies
        working-directory: services/fraud-service
        run: uv sync --locked

      # Runs against a small, fast, synthetic fixture model (tests/conftest.py),
      # not the real trained artifact - the 494MB PaySim CSV it trains from is
      # not distributed with this repo (see docs/sources.md). The real
      # training run and its metrics are verified locally and recorded in
      # models/metrics.json, which IS committed.
      #
      # test_feature_latency.py skips itself (not fails) when no Redis is
      # reachable, which is the case on this runner — its real-Redis p99
      # number is measured and reported in the README, not re-verified here.
      - name: Test
        working-directory: services/fraud-service
        run: uv run pytest -v
