spring:
  application:
    name: payment-api

  jackson:
    # A caller who misspells instructedAmount should be told, not have the
    # payment accepted with a null amount that R01 then blames them for.
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: ${ATLAS_DB_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${ATLAS_DB_USER:atlas}
    # Local-only default, kept so `docker compose up` stays one command.
    # Contrast atlas.security.jwt-secret below, which has no default at all.
    password: ${ATLAS_DB_PASSWORD:atlas}
    hikari:
      # Boot's default of 10 held up until the first 20-VU k6 run, where 1% of
      # requests died on a 30s pool timeout ("active=10, idle=0, waiting=18").
      # Matched to the load test's own VU count.
      maximum-pool-size: 20

  jpa:
    hibernate:
      # Flyway owns the schema. "validate" turns entity/migration drift into a
      # startup failure instead of a silent divergence.
      ddl-auto: validate
    # Keeps the persistence context from spanning the request, so a missing
    # fetch surfaces as LazyInitializationException instead of an N+1.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${ATLAS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Weaker acks would let the outbox poller mark a row dispatched before the
      # broker durably wrote it, reopening the loss window the pattern closes.
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A restarted consumer group must see the existing backlog, not just what
      # arrives after it connects.
      auto-offset-reset: earliest
      # Offsets commit only after the listener returns cleanly, so a poison
      # message is retried rather than silently skipped.
      enable-auto-commit: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Actuator exposes env, beans and threaddump by default; each is an
        # information-disclosure surface. Only these two are needed.
        include: health, prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      # Raw buckets, so Prometheus can compute percentiles server-side.
      # Micrometer's client-side percentiles cannot be aggregated across
      # instances; histogram buckets can.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s

atlas:
  fraud-service:
    base-url: ${ATLAS_FRAUD_SERVICE_URL:http://localhost:8001}
  outbox:
    poll-interval-ms: ${ATLAS_OUTBOX_POLL_INTERVAL_MS:500}
  security:
    # No default on purpose: anyone who can read this can forge a token.
    # Generate one with: openssl rand -base64 32
    jwt-secret: ${ATLAS_JWT_SECRET}
    token-ttl-minutes: ${ATLAS_JWT_TTL_MINUTES:15}
  ops-console:
    # Vite dev server and the compose service. An explicit list, not "*", since
    # a wildcard origin cannot be combined with credentialed requests.
    allowed-origins: ${ATLAS_OPS_CONSOLE_ORIGINS:http://localhost:5173,http://localhost:3002}

resilience4j:
  circuitbreaker:
    instances:
      fraud-service:
        # Count-based, not time-based: trips on failure density regardless of
        # whether it is 2am or peak.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # Paired with the RestClient's own 800ms read timeout, so a hung call
        # fails fast enough to be counted here.
        slow-call-duration-threshold: 800ms
        slow-call-rate-threshold: 50
        # Recovers on its own rather than staying open until someone intervenes.
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true

# TODO: move R08's settlement window and R10's field-length bounds here, so the
# rules can be versioned without a recompile.
