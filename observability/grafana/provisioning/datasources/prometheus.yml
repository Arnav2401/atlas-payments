apiVersion: 1
datasources:
  - name: Prometheus
    # Pinned explicitly (rather than left to Grafana's auto-generated uid)
    # so the dashboard JSON's panel datasource references ("uid": "prometheus")
    # resolve deterministically regardless of provisioning order.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
